name: CI

# GitHub Actions owns the quality gate. The Vercel Git integration owns preview
# and production deployment, so this workflow requires no Vercel credentials.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
      - name: Install (with dev extras)
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run --locked ruff check src/ tests/
      - name: Mypy
        run: uv run --locked mypy src/
      - name: Pytest
        run: uv run --locked pytest -q
