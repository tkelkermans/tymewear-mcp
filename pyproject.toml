[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tymewear-mcp"
version = "0.1.0"
description = "MCP server for Tyme Wear breathing sensor platform"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "keyring>=25.0.0",
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
tymewear-mcp = "tymewear_mcp.cli:main"

[tool.uv]
# Pin transitive dependencies pulled in below their patched version by mcp/httpx/pytest.
override-dependencies = [
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "idna>=3.15",
    "pygments>=2.20.0",
    "pydantic-settings>=2.14.2",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
