[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tymewear-mcp"
version = "0.1.0"
description = "MCP server for Tyme Wear breathing sensor platform"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
tymewear-mcp = "tymewear_mcp.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
